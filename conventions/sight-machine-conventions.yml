idempotency:
  supported: na
  reason: >-
    The public surface is read-only data retrieval — dashboard values, cycles, downtime,
    parts, lines, raw data, machine schemas. No public write endpoint is documented, so
    there is nothing to make idempotent. Ingestion writes happen through FactoryTX edge
    collectors using a separate Edge API key and a configuration file, not through a
    public request API.
dry_run_mode:
  supported: na
  reason: No public write surface.
reversibility:
  grade: na
  reason: >-
    No public write, mutate or delete operation exists on the documented API surface, so
    there is no action for an agent to take back. The Dashboard API returns values; the
    datatab/selector endpoints return production records. Reversibility, dry-run and
    idempotency are all genuinely not applicable rather than absent.
  write_surfaces: []
