note: >-
  Sight Machine markets an MCP server prominently — its own llms.txt says "Publishes
  manufacturing intelligence as an MCP server so any agent in the enterprise can use it",
  and the Enterprise Agents page repeats the claim — but publishes NO endpoint URL, no
  install command, no package, and no documentation page. The 281-page documentation index
  at docs.sightmachine.com/llms.txt contains zero occurrences of "MCP" or "Model Context
  Protocol". Probes for a hosted endpoint all missed. The most likely reading is that the
  server is provisioned inside each customer tenant rather than offered at a public
  address, which means no agent outside a paying tenant can reach it and no schema can be
  introspected. `mode: none` records that nobody ships a reachable server, not that the
  provider has done no work. NO MCPServer pointer is emitted in apis.yml: emitting one
  would credit Sight Machine with an agent surface that cannot be called.
