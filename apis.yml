aid: sight-machine
name: Sight Machine
description: 'Sight Machine is an industrial AI company (founded 2011, San Francisco
  and Ann Arbor) whose Manufacturing Data Platform connects to plant OT and IT systems
  — historians, MES, ERP, PLCs, OPC UA servers and MQTT brokers — and builds a semantic
  model of the factory that AI agents reason over. The platform is delivered as a
  per-customer tenant at {tenant}.sightmachine.io, and exposes its production data
  through a versioned /v1 REST surface (Dashboard API plus datatab/selector data endpoints),
  a first-party Python SDK (smsdk), and a PostgreSQL-wire ODBC/JDBC connector. Edge
  ingestion runs through FactoryTX, which speaks OPC UA, MQTT, SQL and file/cloud-store
  protocols. Authentication is by API key and secret headers issued per tenant; there
  is no public sandbox, no published pricing, and the API reference itself is served
  from inside the authenticated tenant environment.'
