apis:
- aid: sight-machine-dashboard-api
  name: Sight Machine Dashboard API
  description: 'REST endpoint that returns the fully-resolved values behind a Sight
    Machine dashboard, panel by panel, so dashboard data can be consumed by external
    enterprise applications. Authenticated with a tenant API key id and secret passed
    as X-SM-API-Key-Id and X-SM-API-Secret headers. Widgets must be configured for
    background loading before their data is reachable through the API.'
  humanURL: https://docs.sightmachine.com/docs/apis
  baseURL: https://{tenant}.sightmachine.io
  tags:
  - Dashboards
  - Analytics
  - Manufacturing
  properties:
  - type: Documentation
    url: https://docs.sightmachine.com/docs/apis
  - type: Authentication
    url: authentication/sight-machine-authentication.yml
  - type: ErrorCatalog
    url: errors/sight-machine-problem-types.yml
- aid: sight-machine-platform-data-api
  name: Sight Machine Platform Data API
  description: 'The /v1 datatab and selector surface of the Sight Machine Manufacturing
    Data Platform — cycles, downtime, parts, lines, raw data, machine types, machine
    schemas and KPI selectors. This is the surface the first-party Python SDK (smsdk)
    calls. It is served from the customer tenant host and requires an API key id and
    secret, or a session established by basic login.'
  humanURL: https://docs.sightmachine.com/docs/sdk
  baseURL: https://{tenant}.sightmachine.io
