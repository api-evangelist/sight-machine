source: https://docs.sightmachine.com/docs/opc-ua-data-receive.md
note: >-
  Sight Machine publishes no compliance certifications on any public page — the security
  page carries a vulnerability-reporting form and names no SOC 2, ISO 27001, PCI, HIPAA or
  FedRAMP audit. No Compliance pointer is emitted, because there is nothing published to
  point at. What Sight Machine does declare, and declares in its own connector contracts
  rather than in marketing prose, is the industrial interoperability stack.
standards:
