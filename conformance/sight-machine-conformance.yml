domain_standards:
- id: opc-ua
  name: OPC Unified Architecture (IEC 62541)
  conforms: true
  role: consumer
  evidence: >-
    FactoryTX ships a first-party OPC UA Data Receiver
    (https://docs.sightmachine.com/docs/opc-ua-data-receive.md), and the MQTT Transmit
    connector exposes a `use_opc_publisher_format` option plus `opc_payload_metadata` and
    `opc_message_metadata` fields that emit payloads matching Azure Industrial IoT's OPC
    Publisher telemetry format
    (https://github.com/Azure/Industrial-IoT/tree/main/docs/opc-publisher#opc-publisher-telemetry-formats).
    The GitHub org also carries a fork of python-opcua.
  location: FactoryTX connector configuration contract
- id: mqtt
  name: MQTT
  conforms: true
  role: both
  evidence: >-
    FactoryTX publishes both an MQTT Data Receiver
    (https://docs.sightmachine.com/docs/mqtt-data-receiver.md) and an MQTT Transmit
    connector (https://docs.sightmachine.com/docs/mqtt-transmit.md) with a documented
    configuration contract — host, port, topic, client_id, credentials, payload sizing.
  location: FactoryTX connector configuration contract
- id: postgresql-wire
  name: PostgreSQL wire protocol
  conforms: true
  role: server
  evidence: >-
    The ODBC/JDBC connector serves tenant data over PostgreSQL on port 5432, database
    `tenant_storage`, schema `sightmachine`, authenticating with the API key as username
    and the API secret as password
    (https://docs.sightmachine.com/docs/odbc-connector.md). This makes standard
    PostgreSQL clients — PowerBI, Mendix, any JDBC tool — first-class consumers.
  location: ODBC connector documentation
certifications: []
compliance_programs: []
gaps:
- >-
  No SOC 2, ISO 27001, HIPAA, PCI or FedRAMP attestation is published, and no trust center
  exists — notable for a vendor selling into regulated manufacturing (food and beverage,
  life sciences, automotive) whose buyers routinely require them at procurement.
- >-
  No Sparkplug B declaration. The MQTT surface is topic-agnostic and customer-configured,
  so it does not carry the Sparkplug namespace that would let a manufacturing buyer
  integrate with no bespoke connector.
